# hitui configuration
#
# Copy to $XDG_CONFIG_HOME/hitui/config.toml, or ~/.config/hitui/config.toml.
# Every value below is the default, so an empty file behaves identically to
# this one and copying it verbatim changes nothing.
#
# A malformed value is an error rather than a silent fallback: a hex triplet
# with five digits, or a misspelled colour slot, stops hitui at startup and
# says which one. Failing at the first draw instead would mean finding out
# after the terminal had already been taken over.

# ─── Theme ───────────────────────────────────────────────────────────────────

[theme]
# "terminal" follows your terminal's own palette, so a transparent or themed
# terminal shows through. Also: "catppuccin-mocha", "catppuccin-latte",
# "gruvbox-dark", "nord", "dracula", "one-dark", "solarized-dark".
preset = "terminal"

# Under "terminal", the three quiet slots -- dim, border and gauge_track --
# are drawn with the terminal's dim attribute on its own foreground rather
# than in a colour of their own. Naming a colour there is not possible without
# knowing the background: ANSI 8 is a mid-grey on a dark theme and all but
# invisible on a light one (1.05:1 contrast on rose-pine-dawn, where 3:1 is
# the floor for legible text), and ANSI 7 is exactly what "reset" resolves to,
# so dim would come out the same colour as the text it sits behind. Setting
# any of the three to a colour below turns the attribute off for that slot --
# a colour you chose is drawn as you chose it.
#
# Individual colours can be overridden on top of the preset. Values are either
# hex ("#89b4fa" or "0x89b4fa") or an ANSI name:
#
#   reset / default                      the terminal's own
#   black red green yellow               ANSI 0-3
#   blue magenta cyan gray               ANSI 4-7   ("silver" also means gray)
#   dark-gray                            ANSI 8     ("bright-black" too)
#   bright-red .. bright-cyan            ANSI 9-14
#   bright-white                         ANSI 15
#
# Names are normalised the way ratatui normalises its own -- lowercased, with
# spaces, hyphens and underscores dropped, then "bright" read as "light" and
# "grey" as "gray" -- so bright-red, brightred, light_red and lightred are one
# spelling, and a value copied from another ratatui application's config means
# here what it meant there.
#
# Two words are refused rather than guessed, because they parse in both
# vocabularies with a different colour each:
#
#   white        ANSI 7 to some tools, ANSI 15 to ratatui. Write "gray" or
#                "bright-white".
#   bright-gray  reads as ANSI 8, but ratatui folds it to white at ANSI 15.
#                Write "dark-gray" or "bright-white".
#
# Slots:
#   fg              primary text
#   bg              background — leave as "reset" to keep terminal transparency
#   dim             field labels, the "via lspci" provenance tag, help hints
#   border          pane borders
#   border_focused  the border of the focused pane
#   heading         section headings, and group headings in the sidebar
#   accent          key names in the footer, the title
#   cursor_fg       the selected sidebar row
#   cursor_bg
#   status_fg       header and footer
#   status_bg
#   gauge_track     the unfilled part of a gauge bar
#   ok              gauges in a healthy range
#   warn            gauges past 70 % of the way to bad
#   danger          gauges past 90 %, and the marker beside a page that failed
#
# [theme.colors]
# border_focused = "#fabd2f"
# dim = "dark-gray"
# danger = "bright-red"

# ─── Colour overlay ──────────────────────────────────────────────────────────
#
# There is no setting here: this documents a second file hitui reads, so that
# the contract is discoverable from the repo rather than from whatever wrote
# it.
#
# Tools that recolour a desktop from the current wallpaper -- wallust, pywal --
# re-extract a palette on every wallpaper change, and have no business owning
# the file that also holds your keybindings. So hitui reads an optional second
# file holding colours only:
#
#   $XDG_CACHE_HOME/wallust/colors-hitui.toml
#   ~/.cache/wallust/colors-hitui.toml        (when XDG_CACHE_HOME is unset)
#   $HITUI_COLORS_OVERLAY                     (overrides both)
#
# Its shape is a top-level [colors] table -- not [theme.colors] -- matching
# every other file in that template directory:
#
#   [colors]
#   dim = "#6c7086"
#   border = "#45475a"
#   gauge_track = "#45475a"
#
# Its entries merge over [theme.colors] key by key, so an overlay naming only
# "border" leaves the other fourteen as this file has them. hitui is a fresh
# process every launch, so the next run already has the new colours and there
# is no reload hook to arrange.
#
# A missing, unreadable or malformed overlay means "use the config", silently:
# that is the normal state for every palette that is not wallpaper-derived,
# and it also covers the file being half-written when hitui starts. A key that
# is not a colour slot is dropped rather than fatal -- a wallpaper must not be
# able to stop you reading your hardware -- but `hitui --theme` names what it
# dropped, since a generated typo is permanent and would otherwise be silent.
#
# `hitui --theme` shows which layer won for every slot: the preset, this
# file's [theme.colors], or the overlay.

# ─── Layout ──────────────────────────────────────────────────────────────────

[layout]
# Pages whose fields are narrow — memory counters, sensor readings, socket
# statistics — are split into columns so they fit on one screen instead of
# scrolling past three quarters of an empty pane.
#
# This is a ceiling, not a target. A page is only split when it does not fit
# the screen in one column, and only as far as actually makes it shorter:
# pages of long values (Environment Variables, the CPU flag list) stay in one
# wide column, because wrapping those into narrow columns makes them taller.
# Narrow the terminal and the columns go away again.
#
# Set to 1 to keep every page in a single column.
max_columns = 4

# ─── Keybindings ─────────────────────────────────────────────────────────────
#
# Defaults are vim-style: h/j/k/l to move and switch panes, g/G for top and
# bottom, / to filter, q to quit. The arrow keys work alongside them.
#
# Each mode has its own keymap, because `j` moves in the browser and is a
# literal `j` in the filter field.
#
# Four tables per mode, applied in this order:
#
#     base     start from nothing but this — replaces the defaults entirely
#     set      these ACTIONS get exactly these keys, losing the ones they had
#     extra    these KEYS get these actions, on top of whatever is there
#     unbind   these keys do nothing; applied last, so nothing reinstates them
#
# `set` vs `extra` is the distinction that matters:
#
#     set   = [["MoveDown", "e"]]   -- "move down is on e now"; j stops working
#     extra = [["MoveDown", "e"]]   -- "e also moves down";     j still works
#
# `set` replaces an action's other keys, so list every one you want to keep --
# except the arrows, which it never retires. Rebinding j to e is not a
# statement about the Down arrow, and requiring every `set` to restate "down"
# would mean the cost of forgetting is a key that silently stops working. Use
# `unbind = ["down"]` if you really do want an arrow gone.
#
# `unbind` is prefix-based: unbinding "g" also removes any "gg" chord, or `g`
# would still be swallowed while hitui waited for the rest of a chord.
#
# Run `hitui --keys` to see what a config resolves to. It also names any action
# that ended up with no key at all -- which `base`, `set` and `unbind` can all
# cause, and which is otherwise silent.
#
# A key combo is a single key, a key with modifiers, or an array of either
# for a chord:
#     "G"                        -- plain key; case matters, G is not g
#     { key = "d", mod = ["Ctrl"] }
#     "ctrl+d"                   -- the same thing, written inline
#     ["g", "g"]                 -- chord: g then g
#
# Modifiers: "Alt", "Ctrl", "Shift", "Super"
#
# Actions: MoveDown, MoveUp, FocusSidebar, FocusDetail, TogglePane, PageDown,
# PageUp, Top, Bottom, Search, ClearFilter, Refresh, Activate, Help, Quit
#
# The digits 1-9 jump straight to a page. They are not actions, because which
# page each one reaches depends on how many pages there are — but a digit you
# bind yourself wins over the jump.

[keys.browser]
# Colemak-DH home row instead of hjkl, retiring the defaults for those four
# and leaving every other binding untouched:
# set = [
#     ["MoveDown",     "e"],
#     ["MoveUp",       "i"],
#     ["FocusSidebar", "n"],
#     ["FocusDetail",  "o"],
# ]
#
# Free a key for a terminal multiplexer -- zellij or tmux only gets Esc if
# hitui is not sitting on it:
# unbind = ["esc"]
#
# extra = [
#     ["Refresh",  "f5"],
#     ["Quit",     ["Z", "Z"]],
#     ["Bottom",   ["g", "g"]],   # displaces the plain `g`, which would
#                                 # otherwise fire before the chord completed
# ]

# The filter field. Printable keys are literal text here, so only keys that
# cannot be typed are bound -- which is why there is no h/l binding to leave.
[keys.search]
# extra = [
#     ["Activate",    "enter"],
#     ["ClearFilter", "esc"],
# ]

# The help overlay. Any key dismisses it; these are the ones that also do
# something.
[keys.help]
# extra = [
#     ["Help", "esc"],
#     ["Quit", "q"],
# ]
